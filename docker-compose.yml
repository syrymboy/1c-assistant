services:
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:3000}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  app-db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  onec-mock:
    build: ./onec-mock
    environment:
      ONEC_USER: ${ONEC_USER:-odata}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-odata}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Публичные DNS: резолвер хоста (например, раздача с телефона) нестабилен и роняет api.stripe.com
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgresql+psycopg://app:${APP_DB_PASSWORD:-app}@app-db:5432/app
      # issuer — внешний адрес (как в токене), JWKS — внутренний адрес в сети Docker
      OIDC_ISSUER: ${PUBLIC_URL:-http://localhost:3000}/auth/realms/assistant
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/assistant/protocol/openid-connect/certs
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACKS: ${GEMINI_FALLBACKS:-gemini-flash-lite-latest,gemini-3.5-flash,gemini-4-hydrogen}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      INTERNAL_URL: http://localhost:8000
      ONEC_ODATA_URL: ${ONEC_ODATA_URL:-http://onec-mock:8100/odata/standard.odata}
      ONEC_USER: ${ONEC_USER:-odata}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-odata}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      onec-mock:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_URL:-http://localhost:3000}/auth
        VITE_KEYCLOAK_REALM: assistant
        VITE_KEYCLOAK_CLIENT_ID: assistant-web
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  keycloak-db-data:
  app-db-data:
